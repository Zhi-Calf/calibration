    use_point_pick: true
    max_rounds: 1
    max_rmse_accept: 0.30
    max_translation_jump_m: 0.50
    max_rotation_jump_deg: 20.0
    pick_num_points: 4
    pick_padding: 0.05

    # Input
    lidar_topic: "/right/rslidar_points"
    image_topic: "/cam3/image_raw"
    bag_path: "/mnt/f/AI/calibration/data/rosbag2_2026_03_14-14_36_51_cam3"
    image_path: ""

    # Output
    output_path: "/mnt/f/AI/calibration/data/output/cam3_external"
