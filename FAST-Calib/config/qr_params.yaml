fast_calib:
  ros__parameters:
    # Camera intrinsics (cam3)
    fx: 1476.4569562447177
    fy: 1558.111136518117
    cx: 751.2242106723367
    cy: 509.6227667391199
    k1: -0.8812195820589294
    k2: -0.2076906891873392
    p1: 0.01717465957330068
    p2: 0.10596283129815083

    # Target / detection
    marker_size: 0.20
    min_detected_markers: 1
    delta_width_qr_center: 0.55
    delta_height_qr_center: 0.35
    delta_width_circles: 0.5
    delta_height_circles: 0.4
