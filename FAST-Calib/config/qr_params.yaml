# FAST-Calib ROS 2 configuration
# Note: $(find ...) is not supported in ROS 2 YAML — use absolute paths.

fast_calib:
  ros__parameters:
    # Camera intrinsics (Ruby 128 + your camera)
    fx: 2478.48702288166
    fy: 2478.58544825456
    cx: 1230.99707596681
    cy: 1025.66149498072
    k1: -0.0493178189623200
    k2: 0.147394487986097
    p1: -0.00127118592043482
    p2: -0.00200379689523022

    # Calibration target parameters
    marker_size: 0.20
    delta_width_qr_center: 0.55
    delta_height_qr_center: 0.35
    delta_width_circles: 0.5
    delta_height_circles: 0.4
    circle_radius: 0.12

    # Distance filter (used when use_point_pick is false, or as fallback)
    x_min: 2.0
    x_max: 5.0
    y_min: -1.0
    y_max: 4.0
    z_min: 0.0
    z_max: 2.0

    # Point pick mode: click on calibration board in RViz2 to set filter bounds
    use_point_pick: true
    pick_num_points: 4
    pick_padding: 0.3

    # Input — ROS 2 bag directory path (not a .bag file)
    # Topics: /right/rslidar_points or /left/rslidar_points, /cam0~3/image_raw
    lidar_topic: "/right/rslidar_points"
    image_topic: "/cam3/image_raw"
    bag_path: "/media/cindy/nian/rosbag2_2026_03_14-14_40_11"
    image_path: ""

    # Output
    output_path: "/media/cindy/nian/calib_data/output"

# For multi_fast_calib node (same params, different node name)
multi_fast_calib:
  ros__parameters:
    fx: 2478.48702288166
    fy: 2478.58544825456
    cx: 1230.99707596681
    cy: 1025.66149498072
    k1: -0.0493178189623200
    k2: 0.147394487986097
    p1: -0.00127118592043482
    p2: -0.00200379689523022

    marker_size: 0.20
    delta_width_qr_center: 0.55
    delta_height_qr_center: 0.35
    delta_width_circles: 0.5
    delta_height_circles: 0.4
    circle_radius: 0.12

    x_min: 2.0
    x_max: 5.0
    y_min: -1.0
    y_max: 4.0
    z_min: 0.0
    z_max: 2.0

    use_point_pick: false
    pick_num_points: 4
    pick_padding: 0.3

    lidar_topic: "/right/rslidar_points"
    image_topic: "/cam3/image_raw"
    bag_path: ""
    image_path: ""
    output_path: "/media/cindy/nian/calib_data/output"
